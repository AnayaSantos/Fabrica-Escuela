spring.application.name=envios-backend
server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/envios_hu}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:envios}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:envios_dev}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

jwt.secret=${JWT_SECRET:dev-only-secret-key-envios-backend-change-in-production-32bytes-min}
jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:86400}

app.admin-seed.nombre=${ADMIN_SEED_NOMBRE:Administrador}
app.admin-seed.correo=${ADMIN_SEED_EMAIL:admin@envios.local}
app.admin-seed.password=${ADMIN_SEED_PASSWORD:Admin123!}
