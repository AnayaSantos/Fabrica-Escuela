services:
  db:
    image: postgres:16-alpine
    container_name: hu-envios-test-db
    environment:
      POSTGRES_DB: envios_hu
      POSTGRES_USER: envios
      POSTGRES_PASSWORD: envios_dev
    ports:
      - "55432:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U envios -d envios_hu"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: hu-envios-test-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/envios_hu
      SPRING_DATASOURCE_USERNAME: envios
      SPRING_DATASOURCE_PASSWORD: envios_dev
      SPRING_JPA_DDL_AUTO: update
      APP_CORS_ALLOWED_ORIGINS: http://localhost:5174,http://127.0.0.1:5174
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "18080:8080"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:18080
    container_name: hu-envios-test-frontend
    depends_on:
      - backend
    ports:
      - "5174:80"

volumes:
  postgres_test_data:
    name: hu-envios-test-postgres-data
